# Refreshes assets/scholar.json twice a day (via SerpApi) so the homepage shows current citations.
# Two runs a day use about 62 of SerpApi's 250 free searches per month.
name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 3,15 * * *"   # 03:17 and 15:17 UTC (GitHub may start scheduled runs a little late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/update_scholar.py
        env:
          SCHOLAR_ID: tVb54uUAAAAJ
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar.json
          git diff --cached --quiet || git commit -m "Update Google Scholar citations"
          git push
