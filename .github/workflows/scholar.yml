# Refreshes assets/scholar.json once a day so the homepage can show live citations.
name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 9 * * *"      # every day, 09:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install scholarly "bibtexparser<2"   # scholarly still imports the 1.x API
      - run: python scripts/update_scholar.py
        env:
          SCHOLAR_ID: tVb54uUAAAAJ
      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar.json
          git diff --cached --quiet || git commit -m "Update Google Scholar citations"
          git push
